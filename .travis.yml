# references:
# * https://www.objc.io/issues/6-build-tools/travis-ci/
# * https://github.com/supermarin/xcpretty#usage

osx_image: xcode14.2
language: objective-c
# cache: cocoapods
# podfile: Example/Podfile
# before_install:
# - gem install cocoapods # Since Travis is not always on latest version
# - pod install --project-directory=Example
script:
- set -o pipefail && xcodebuild test -enableCodeCoverage YES -workspace Example/MMTToolForHUD.xcworkspace -scheme MMTToolForHUD-Example -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.2' ONLY_ACTIVE_ARCH=NO | xcpretty
- pod lib lint

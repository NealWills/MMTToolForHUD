name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit and performance tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        working-directory: Example
        run: pod install

      - name: Resolve simulator
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for device in devices:
                  if device['isAvailable'] and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Resolved simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: Example
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace MMTToolForHUD.xcworkspace \
            -scheme MMTToolForHUD-Example \
            -destination "id=${SIM_UDID}" \
            | tail -40
